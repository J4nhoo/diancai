# 家庭点菜 —— Nginx 站点配置（纯 IP 访问版）
#
# 适用场景：腾讯云轻量应用服务器（香港/新加坡），没有域名，直接用 IP 访问。
# 放置位置：/etc/nginx/conf.d/meal-order.conf
#
# 注意：没有域名就没有 HTTPS，浏览器会显示「不安全」。
# 微信内打开一个 http://<IP> 的链接可能提示「非官方网页」。
# 如果以后想消除这些提示，需要买域名 + 配 HTTPS。

server {
    listen 80;
    listen [::]:80;

    # 用 IP 访问时 server_name 可写 _（匹配任意）
    server_name _;

    charset utf-8;

    # 上传图片的大小上限，需 >= server/.env 的 MAX_UPLOAD_MB
    client_max_body_size 10m;

    # gzip
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端静态文件
    root /srv/meal-order/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA 回退
    }

    # 带指纹的静态资源长缓存；index.html 不缓存，避免发版后拿到旧页面
    location ~* \.(?:js|css|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 菜品图片：如果 STORAGE_DRIVER=local，由 Nginx 直接托管
    # 用 COS 的话这段不会命中，留着不影响
    location /uploads/ {
        alias /srv/meal-order/server/uploads/;
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;        # 图片上传走流式
    }
}
