# 家庭点菜 H5 —— Nginx 站点配置
#
# 部署前请替换以下占位符：
#   meal.example.com      你的域名
#   /srv/meal-order        项目根目录（其下有 server/ 与 web/）
#
# 放置位置：/etc/nginx/conf.d/meal-order.conf
# 证书申请：sudo certbot --nginx -d meal.example.com
#           certbot 会自动改写本文件的证书路径。

# ---------- HTTP：全量跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name meal.example.com;

    # 保留 certbot 的 http-01 校验路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meal.example.com;

    # certbot 会自动维护下面两行（首次部署先注释掉，申请证书后再取消注释）
    ssl_certificate     /etc/letsencrypt/live/meal.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meal.example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;    # 需 >= server/.env 的 MAX_UPLOAD_MB

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /srv/meal-order/web;
    index index.html;

    # ---------- 前端静态资源 ----------
    location / {
        try_files $uri $uri/ /index.html;   # SPA 回退
    }

    # 带指纹/第三方库：长缓存。注意 index.html 不缓存，避免发版后拿旧壳
    location ~* \.(?:js|css|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---------- 菜品图片：Nginx 直接托管 ----------
    # 与 server/.env 的 IMAGE_URL_PREFIX、IMAGE_DIR 保持一致
    location /uploads/ {
        alias /srv/meal-order/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 后端 API：反向代理 ----------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_request_buffering off;        # 图片上传走流式
    }
}
